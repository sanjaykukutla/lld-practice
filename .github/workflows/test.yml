name: test-script

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: node ci-interact.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: |
            before-click.png
            after-click.png
